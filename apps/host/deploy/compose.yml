name: cerebrium

services:
  postgres:
    image: paradedb/paradedb:0.25.10-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerebrium
      POSTGRES_DB: cerebrium
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    secrets:
      - pg_password
    volumes:
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cerebrium", "-d", "cerebrium"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s

  daemon:
    image: ghcr.io/makhnogk/cerebrium:${CEREBRIUM_TAG:?set CEREBRIUM_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_JOBS_CODE_INDEX_MS: "0"
      MEMORY_STORE_BACKEND: postgres
      MEMORY_PG_URL_FILE: /run/secrets/pg_url
      MEMORY_RPC_LISTEN: 0.0.0.0:7433
      # Ollama runs natively on the host for the GPU; host.docker.internal is its loopback.
      MEMORY_CONSOLIDATE: http
      MEMORY_CONSOLIDATE_URL: http://host.docker.internal:11434/api/chat
      MEMORY_CONSOLIDATE_MODEL: gemma4:12b-it-qat
      MEMORY_CONSOLIDATE_TIMEOUT_MS: "180000"
      MEMORY_CONSOLIDATE_ANNOTATE_BATCH: "10"
      MEMORY_CONSOLIDATE_BACKFILL_BATCH: "10"
      MEMORY_PRINCIPALS: >-
        {"cerebrium-runner": {"capabilities": {"read": "auto", "write": "suggest",
        "consolidate": "off", "admin": "off"}, "quota": {"windowMs": 3600000, "writes": 60},
        "weight": 0.8}}
    ports:
      # The tailnet address only: the listener has tokens but no TLS.
      - "${CEREBRIUM_RPC_BIND:-100.92.157.103}:7433:7433"
    secrets:
      - pg_url
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the embedding model into the volume.
      start_period: 10m
      start_interval: 5s
    stop_grace_period: 30s

  runner:
    image: ghcr.io/makhnogk/cerebrium:${CEREBRIUM_TAG:?set CEREBRIUM_TAG}
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    command: ["node", "dist/runner.js"]
    environment:
      MEMORY_RUNNER: "true"
      MEMORY_RUNNER_OAUTH_TOKEN_FILE: /run/secrets/claude_oauth_token
    secrets:
      - claude_oauth_token
    volumes:
      - data:/data
    stop_grace_period: 30s

  dashboard:
    image: ghcr.io/makhnogk/cerebrium:${CEREBRIUM_TAG:?set CEREBRIUM_TAG}
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    command: ["node", "dist/dashboard.js"]
    environment:
      DASHBOARD_PORT: "7480"
      DASHBOARD_OLLAMA_URL: http://host.docker.internal:11434
    ports:
      # The tailnet address only: the dashboard has no login.
      - "${CEREBRIUM_RPC_BIND:-100.92.157.103}:7480:7480"
    volumes:
      - data:/data
    stop_grace_period: 10s

secrets:
  claude_oauth_token:
    file: ${CEREBRIUM_SECRETS:?set CEREBRIUM_SECRETS}/claude_oauth_token
  pg_password:
    file: ${CEREBRIUM_SECRETS:?set CEREBRIUM_SECRETS}/pg_password
  pg_url:
    file: ${CEREBRIUM_SECRETS:?set CEREBRIUM_SECRETS}/pg_url

volumes:
  data:
    name: cerebrium-data
  pg:
    name: cerebrium-pg
